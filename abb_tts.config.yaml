# Audiobook Builder TTS Configuration

# Basic settings
log_file: "abb_tts.log"
output_dir: "./output"
temp_dir: "./temp"
default_voice: "en-US"
default_provider: "espeak"

# Server settings
server_port: "8080"
server_host: "0.0.0.0"
open_browser: true

# TTS settings
bit_rate_kbs: 128
sample_rate_hz: 44100
default_speed: 1.0
default_pitch: 1.0

# Cloud provider settings
cloud_api_key: ""
google_tts_endpoint: ""
azure_tts_endpoint: ""

# Audiobookshelf integration
audiobookshelf_url: ""
audiobookshelf_user: "admin"
audiobookshelf_password: ""
audiobookshelf_library: "TTS Books"
